<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainee 360° Profile · Government Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/api.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body { background: #f0f4f9; min-height: 100vh; color: #0b1a33; }

    /* ===== TOP BAR ===== */
    .topbar {
      background: white; padding: 14px 32px;
      border-bottom: 1px solid #e2e8f0;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 10px; background: #f1f5f9;
      color: #475569; text-decoration: none; font-size: 13px;
      font-weight: 600; transition: 0.2s; border: 1px solid #e2e8f0;
    }
    .back-btn:hover { background: #e2e8f0; }
    .topbar-title { font-size: 16px; font-weight: 700; }
    .topbar-title span { color: #7c3aed; }
    .role-badge {
      padding: 6px 14px; border-radius: 20px; font-size: 12px;
      font-weight: 600; background: #ede9fe; color: #7c3aed;
      display: inline-flex; align-items: center; gap: 6px;
    }

    /* ===== CONTAINER ===== */
    .container { max-width: 1100px; margin: 24px auto; padding: 0 24px 60px; }

    /* ===== LOADING ===== */
    .loading-box {
      text-align: center; padding: 60px 20px; background: white;
      border-radius: 18px; border: 1px solid #eef2f6;
    }
    .spinner {
      width: 44px; height: 44px; border: 4px solid #ede9fe;
      border-top-color: #7c3aed; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== NOT FOUND ===== */
    .notfound-box {
      text-align: center; padding: 80px 20px; background: white;
      border-radius: 18px; border: 1px solid #eef2f6;
    }
    .notfound-box i { font-size: 64px; color: #fecaca; margin-bottom: 20px; display: block; }
    .notfound-box h2 { font-size: 22px; margin-bottom: 8px; }
    .notfound-box p { color: #64748b; font-size: 14px; margin-bottom: 6px; }
    .notfound-box .id {
      display: inline-block; margin-top: 12px; padding: 8px 20px;
      background: #f1f5f9; border-radius: 10px; font-family: monospace;
      font-size: 14px; color: #475569; font-weight: 600;
    }

    /* ===== PROFILE HEADER ===== */
    .profile-header {
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 50%, #a855f7 100%);
      color: white; padding: 32px 36px; border-radius: 20px 20px 0 0;
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    .profile-header::before {
      content: ''; position: absolute; width: 400px; height: 400px;
      border-radius: 50%; background: rgba(255,255,255,0.05);
      top: -200px; right: -100px;
    }
    .profile-avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: 3px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .profile-info { position: relative; z-index: 1; flex: 1; min-width: 220px; }
    .profile-info h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .profile-info .sub { font-size: 14px; opacity: 0.9; display: flex; gap: 16px; flex-wrap: wrap; }
    .profile-info .sub span { display: inline-flex; align-items: center; gap: 6px; }
    .profile-status { position: relative; z-index: 1; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 24px; font-size: 13px;
      font-weight: 600; background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3);
    }
    .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    /* ===== LIFECYCLE TIMELINE ===== */
    .lifecycle {
      background: white; padding: 28px 36px;
      border-bottom: 1px solid #eef2f6;
    }
    .lifecycle h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #7c3aed; margin-bottom: 20px; padding-bottom: 10px;
      border-bottom: 2px solid #ede9fe;
      display: flex; align-items: center; gap: 8px; font-weight: 700;
    }
    .lifecycle h2 i { font-size: 14px; }
    .timeline {
      display: flex; justify-content: space-between; align-items: flex-start;
      position: relative; padding: 10px 0; flex-wrap: wrap; gap: 12px;
    }
    .timeline-step {
      flex: 1; min-width: 110px; text-align: center; position: relative;
    }
    .timeline-step .icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: #f1f5f9; color: #94a3b8;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px; font-size: 18px;
      border: 3px solid white; box-shadow: 0 0 0 1px #e2e8f0;
      position: relative; z-index: 1;
    }
    .timeline-step.done .icon {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white; box-shadow: 0 0 0 1px #7c3aed;
    }
    .timeline-step .label {
      font-size: 11px; font-weight: 600; color: #475569;
    }
    .timeline-step.done .label { color: #7c3aed; }

    /* ===== SECTIONS ===== */
    .section {
      background: white; padding: 24px 36px;
      border-bottom: 1px solid #eef2f6;
    }
    .section:last-of-type { border-radius: 0 0 20px 20px; border-bottom: none; }
    .section h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #7c3aed; margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 2px solid #ede9fe;
      display: flex; align-items: center; gap: 8px; font-weight: 700;
    }
    .section h2 i { font-size: 14px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px; }
    .field {
      display: flex; flex-direction: column; padding: 10px 14px;
      background: #f8fafc; border-radius: 10px; border: 1px solid #f1f5f9;
    }
    .field .label {
      font-size: 11px; color: #94a3b8; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 4px; font-weight: 600;
    }
    .field .value {
      font-size: 14px; font-weight: 600; color: #0b1a33; word-break: break-word;
    }
    .field .value.muted { color: #94a3b8; font-weight: 500; }

    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-tag {
      padding: 5px 14px; background: #ede9fe; color: #5b21b6;
      border-radius: 20px; font-size: 12px; font-weight: 600;
    }

    /* ===== ACTION BAR ===== */
    .action-bar {
      margin-top: 24px; padding: 20px 24px; background: white;
      border-radius: 16px; border: 1px solid #eef2f6;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .btn {
      padding: 11px 22px; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; border: none;
      text-decoration: none; display: inline-flex;
      align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7); color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.3);
    }
    .btn-outline {
      background: white; color: #7c3aed; border: 2px solid #c4b5fd;
    }
    .btn-outline:hover { background: #f5f3ff; }

    /* ===== REG DETAILS ===== */
    #regDetails {
      display: none; margin-top: 16px; padding: 18px 20px;
      background: #f5f3ff; border-left: 4px solid #7c3aed;
      border-radius: 8px; font-size: 13px; line-height: 1.8; color: #334155;
    }
    #regDetails.show { display: block; }
    #regDetails strong { color: #5b21b6; }
    #regDetails table { width: 100%; margin-top: 10px; border-collapse: collapse; }
    #regDetails td { padding: 6px 10px; border-bottom: 1px solid #ddd6fe; font-size: 13px; }
    #regDetails td:first-child { color: #64748b; font-weight: 600; width: 200px; }
    #regDetails td:last-child { color: #0b1a33; font-weight: 500; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .profile-header { padding: 24px; }
      .profile-avatar { width: 70px; height: 70px; font-size: 28px; }
      .profile-info h1 { font-size: 20px; }
      .section { padding: 20px 24px; }
      .lifecycle { padding: 20px 24px; }
      .container { padding: 0 16px 40px; }
      .topbar { padding: 12px 16px; }
      .timeline-step { min-width: 80px; }
    }
  </style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <div class="topbar-title">Trainee <span>360° Profile</span></div>
  </div>
  <div class="topbar-right">
    <span class="role-badge">
      <i class="fas fa-landmark"></i> Government View
    </span>
  </div>
</div>

<!-- ===== CONTAINER ===== -->
<div class="container" id="container">
  <div class="loading-box">
    <div class="spinner"></div>
    <p style="color:#64748b;font-size:14px;">Loading trainee lifecycle…</p>
  </div>
</div>

<script>
/* ============================================================
   TRAINEE 360° PROFILE — Backend-first
   ------------------------------------------------------------
   Loads full trainee profile from /api/govt/trainee/<id>/full
   Fallback: localStorage-based lookup (for offline / demo)
   ============================================================ */

/* ============================================================
   1. READ traineeId FROM URL (can be numeric id OR trainee_code)
   ============================================================ */
const params = new URLSearchParams(window.location.search);
const traineeId = params.get('traineeId');

/* ============================================================
   2. LOAD FROM BACKEND (primary) OR localStorage (fallback)
   ============================================================ */
async function loadTrainee(id) {
  if (!id) return null;

  // --- Try backend first ---
  try {
    // The govt dashboard passes trainee_code like "TRN10001" OR numeric id.
    // Backend route is /api/govt/trainee/<int:tid>/full — expects numeric id.
    // So: if the id is non-numeric, we resolve it via /api/trainees?search=
    let numericId = null;

    if (/^\d+$/.test(id)) {
      numericId = parseInt(id, 10);
    } else {
      // Try /api/trainees?search=<code> to find it
      const searchRes = await apiCall('/api/trainees?search=' + encodeURIComponent(id));
      if (searchRes.ok && Array.isArray(searchRes.data)) {
        const found = searchRes.data.find(t =>
          t.trainee_code === id || String(t.id) === String(id)
        );
        if (found) numericId = found.id;
      }
    }

    if (numericId) {
      const res = await apiCall('/api/govt/trainee/' + numericId + '/full');
      if (res.ok && res.data && !res.data.error) {
        return normalizeBackendTrainee(res.data);
      }
    }
  } catch (e) {
    console.warn('Backend trainee 360 load failed, using localStorage:', e);
  }

  // --- Fallback: localStorage ---
  return findTraineeInLocalStorage(id);
}

/* ============================================================
   3. NORMALIZE BACKEND RESPONSE → internal shape
   ============================================================ */
function normalizeBackendTrainee(raw) {
  const t = raw || {};
  const empList = Array.isArray(t.employments) ? t.employments : [];
  const folList = Array.isArray(t.followups) ? t.followups : [];
  const retList = Array.isArray(t.retention) ? t.retention : [];

  const emp = empList[0] || {};
  // Find earliest pending follow-up or the first one
  const fol = folList.find(f => f.status === 'due' || f.status === 'pending') || folList[0] || {};

  // Verification: employment status verified OR verificationStatus field
  let verStatus = 'pending';
  if (emp.status === 'verified') verStatus = 'verified';

  // Retention: retained at any period → 1
  const retainedAt = {};
  retList.forEach(r => { retainedAt[r.days] = r.retained; });

  // Skills can be comma-separated string or array
  const skillsArr = Array.isArray(t.skills)
    ? t.skills
    : (typeof t.skills === 'string' && t.skills.trim()
        ? t.skills.split(',').map(s => s.trim()).filter(Boolean)
        : []);

  const certsArr = Array.isArray(t.certifications)
    ? t.certifications
    : (typeof t.certifications === 'string' && t.certifications.trim()
        ? t.certifications.split(',').map(s => s.trim()).filter(Boolean)
        : []);

  // Location
  const loc = [t.district, t.state].filter(Boolean).join(', ');

  // Compute training progress from assessment_score if present
  const progress = t.assessment_score ? Math.round(t.assessment_score) : 0;

  return {
    // -------- Basic --------
    id: t.trainee_code || ('TRN' + t.id),
    backendId: t.id,
    name: t.full_name || 'Unnamed Trainee',
    dob: t.dob || '',
    gender: t.gender || '',
    phone: t.phone || '',
    email: t.email || '',
    location: loc,
    category: t.category || '',

    // -------- Education --------
    qualification: t.qualification || '',
    institution: t.institution || '',
    passYear: t.pass_year || '',
    score: t.score || '',

    // -------- Training --------
    course: t.skills || t.qualification || '',
    provider: '',
    batch: '',
    trainingStatus: t.training_status || '',
    trainingProgress: progress,

    // -------- Skills --------
    skills: skillsArr,
    certifications: certsArr,

    // -------- Assessment --------
    assessmentScore: t.assessment_score || '',
    assessmentDate: t.assessment_date || '',
    assessmentResult: t.assessment_result || '',

    // -------- Employment --------
    empStatus: emp.status === 'verified' ? 'Employed'
             : emp.status === 'pending' ? 'Pending Verification'
             : emp.status || '',
    empCompany: emp.employer_name || '',
    empRole: emp.job_role || '',
    empType: emp.employment_type || '',
    empJoining: emp.start_date || '',
    empLocation: emp.job_location || '',
    empIncome: emp.monthly_income || '',
    empPrevIncome: emp.pre_training_income || '',

    // -------- Follow-up --------
    followupStatus: fol.status || '',
    followupPeriod: fol.period_days ? fol.period_days + ' Days' : '',
    followupDate: fol.due_date || '',

    // -------- Registration --------
    regDate: (t.created_at || '').split('T')[0] || '',
    regBy: 'Self (Online Portal)',

    // -------- Verification --------
    verificationStatus: verStatus,
    verifiedBy: emp.verified_by || '',
    verifiedAt: emp.verified_at || '',

    // -------- Retention --------
    retention: retainedAt,
    enrollments: t.enrollments || [],
  };
}

/* ============================================================
   4. FALLBACK — localStorage lookup
   ============================================================ */
function findTraineeInLocalStorage(id) {
  const allTrainees   = JSON.parse(localStorage.getItem('allTrainees')   || '[]');
  const allEmployment = JSON.parse(localStorage.getItem('allEmployment') || '[]');
  const allFollowups  = JSON.parse(localStorage.getItem('allFollowups')  || '[]');

  let index = allTrainees.findIndex(t => t.traineeId === id || t.id === id || t.email === id);
  if (index === -1 && /^TRN\d+$/.test(id)) {
    const num = parseInt(id.replace('TRN', ''), 10) - 1;
    if (num >= 0 && num < allTrainees.length) index = num;
  }
  if (index === -1) return null;

  const t   = allTrainees[index];
  const emp = allEmployment.find(e => e.traineeEmail === t.email) || {};
  const fol = allFollowups.find(f => f.traineeEmail === t.email)  || {};

  let verStatus = t.verificationStatus || 'pending';
  if (verStatus === 'verified' || emp.verified) verStatus = 'verified';

  return {
    id: t.traineeId || id,
    backendId: t.id,
    name: t.fullName || t.name || 'Unnamed Trainee',
    dob: t.dateOfBirth || t.dob || '',
    gender: t.gender || '',
    phone: t.mobile || t.phone || '',
    email: t.email || '',
    location: [t.district, t.state].filter(Boolean).join(', ') || t.location || '',
    category: t.category || t.socialCategory || '',
    qualification: t.qualification || t.highestQualification || '',
    institution: t.institution || '',
    passYear: t.yearOfPassing || t.passYear || '',
    score: t.percentage || t.cgpa || t.score || '',
    course: t.skillTrade || t.course || '',
    provider: t.trainingProvider || t.provider || '',
    batch: t.batchId || t.batch || '',
    trainingStatus: t.trainingStatus || t.certificationStatus || '',
    trainingProgress: t.trainingProgress || 0,
    skills: Array.isArray(t.skills) ? t.skills : (t.skills ? String(t.skills).split(',').map(s => s.trim()).filter(Boolean) : []),
    certifications: Array.isArray(t.certifications) ? t.certifications : (t.certifications ? String(t.certifications).split(',').map(s => s.trim()).filter(Boolean) : []),
    assessmentScore: t.assessmentScore || '',
    assessmentDate: t.assessmentDate || '',
    assessmentResult: t.assessmentResult || '',
    empStatus: emp.status || '',
    empCompany: emp.companyName || '',
    empRole: emp.jobRole || '',
    empType: emp.employmentType || '',
    empJoining: emp.joiningDate || '',
    empLocation: emp.jobCity || '',
    empIncome: emp.currentIncome || '',
    empPrevIncome: emp.previousIncome || '',
    followupStatus: fol.status || '',
    followupPeriod: fol.period || '',
    followupDate: fol.date || '',
    regDate: t.registrationDate || t.registeredAt || '',
    regBy: t.registeredBy || 'Self (Online Portal)',
    verificationStatus: verStatus,
    verifiedBy: t.verifiedBy || '',
    verifiedAt: t.verifiedAt || '',
    retention: {},
    enrollments: [],
  };
}

/* ============================================================
   5. RENDER
   ============================================================ */
async function render() {
  const container = document.getElementById('container');

  if (!traineeId) {
    container.innerHTML = notFoundHTML('No trainee ID provided in the URL.');
    return;
  }

  const t = await loadTrainee(traineeId);

  if (!t) {
    container.innerHTML = notFoundHTML(
      'This trainee record could not be found in the system.',
      traineeId
    );
    return;
  }

  const initial = (t.name || 'T').charAt(0).toUpperCase();
  const muted = v => v ? escapeHtml(v) : '<span class="value muted">Not provided</span>';

  const skillsHTML = Array.isArray(t.skills) && t.skills.length
    ? t.skills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')
    : '<span class="value muted">No skills recorded</span>';

  const certsHTML = Array.isArray(t.certifications) && t.certifications.length
    ? t.certifications.map(c => `<span class="skill-tag">${escapeHtml(c)}</span>`).join('')
    : '<span class="value muted">No certifications recorded</span>';

  // Lifecycle step completion flags
  const stepReg    = !!t.regDate;
  const stepTrain  = !!t.trainingStatus && t.trainingProgress >= 100;
  const stepAssess = !!t.assessmentResult;
  const stepEmp    = !!t.empStatus;
  const stepFollow = !!t.followupDate;
  const stepIncome = !!t.empIncome;

  container.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${escapeHtml(initial)}</div>
      <div class="profile-info">
        <h1>${escapeHtml(t.name)}</h1>
        <div class="sub">
          <span><i class="fas fa-id-card"></i> ${escapeHtml(t.id)}</span>
          ${t.course ? `<span><i class="fas fa-graduation-cap"></i> ${escapeHtml(t.course)}</span>` : ''}
          ${t.location ? `<span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(t.location)}</span>` : ''}
        </div>
      </div>
      <div class="profile-status">
        <span class="badge">
          <span class="dot"></span>
          ${t.verificationStatus.charAt(0).toUpperCase() + t.verificationStatus.slice(1)}
        </span>
      </div>
    </div>

    <!-- LIFECYCLE TIMELINE -->
    <div class="lifecycle">
      <h2><i class="fas fa-route"></i> Trainee Lifecycle (360°)</h2>
      <div class="timeline">
        <div class="timeline-step ${stepReg ? 'done' : ''}">
          <div class="icon"><i class="fas fa-user-plus"></i></div>
          <div class="label">Registration</div>
        </div>
        <div class="timeline-step ${stepTrain ? 'done' : ''}">
          <div class="icon"><i class="fas fa-chalkboard-teacher"></i></div>
          <div class="label">Training</div>
        </div>
        <div class="timeline-step ${stepAssess ? 'done' : ''}">
          <div class="icon"><i class="fas fa-clipboard-check"></i></div>
          <div class="label">Assessment</div>
        </div>
        <div class="timeline-step ${stepEmp ? 'done' : ''}">
          <div class="icon"><i class="fas fa-briefcase"></i></div>
          <div class="label">Employment</div>
        </div>
        <div class="timeline-step ${stepFollow ? 'done' : ''}">
          <div class="icon"><i class="fas fa-phone"></i></div>
          <div class="label">Follow-up</div>
        </div>
        <div class="timeline-step ${stepIncome ? 'done' : ''}">
          <div class="icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="label">Income</div>
        </div>
      </div>
    </div>

    <!-- BASIC -->
    <div class="section">
      <h2><i class="fas fa-user"></i> Basic Information</h2>
      <div class="grid">
        <div class="field"><span class="label">Trainee ID</span><span class="value">${escapeHtml(t.id)}</span></div>
        <div class="field"><span class="label">Full Name</span><span class="value">${escapeHtml(t.name)}</span></div>
        <div class="field"><span class="label">Date of Birth</span><span class="value">${muted(t.dob)}</span></div>
        <div class="field"><span class="label">Gender</span><span class="value">${muted(t.gender)}</span></div>
        <div class="field"><span class="label">Phone</span><span class="value">${muted(t.phone)}</span></div>
        <div class="field"><span class="label">Email</span><span class="value">${muted(t.email)}</span></div>
        <div class="field"><span class="label">District / State</span><span class="value">${muted(t.location)}</span></div>
        <div class="field"><span class="label">Category</span><span class="value">${muted(t.category)}</span></div>
      </div>
    </div>

    <!-- EDUCATION -->
    <div class="section">
      <h2><i class="fas fa-book"></i> Education Details</h2>
      <div class="grid">
        <div class="field"><span class="label">Highest Qualification</span><span class="value">${muted(t.qualification)}</span></div>
        <div class="field"><span class="label">Institution</span><span class="value">${muted(t.institution)}</span></div>
        <div class="field"><span class="label">Year of Passing</span><span class="value">${muted(t.passYear)}</span></div>
        <div class="field"><span class="label">Percentage / CGPA</span><span class="value">${muted(t.score)}</span></div>
      </div>
    </div>

    <!-- TRAINING -->
    <div class="section">
      <h2><i class="fas fa-chalkboard-teacher"></i> Training Details</h2>
      <div class="grid">
        <div class="field"><span class="label">Course Name</span><span class="value">${muted(t.course)}</span></div>
        <div class="field"><span class="label">Training Provider</span><span class="value">${muted(t.provider)}</span></div>
        <div class="field"><span class="label">Batch / Duration</span><span class="value">${muted(t.batch)}</span></div>
        <div class="field"><span class="label">Training Status</span><span class="value">${muted(t.trainingStatus)}</span></div>
        <div class="field"><span class="label">Progress</span><span class="value">${t.trainingProgress ? t.trainingProgress + '%' : '<span class="value muted">Not tracked</span>'}</span></div>
      </div>
    </div>

    <!-- SKILLS -->
    <div class="section">
      <h2><i class="fas fa-star"></i> Skills & Certifications</h2>
      <div class="grid">
        <div class="field" style="grid-column:1/-1;">
          <span class="label">Primary Skills</span>
          <div class="skills-list" style="margin-top:6px;">${skillsHTML}</div>
        </div>
        <div class="field" style="grid-column:1/-1;">
          <span class="label">Certifications</span>
          <div class="skills-list" style="margin-top:6px;">${certsHTML}</div>
        </div>
      </div>
    </div>

    <!-- ASSESSMENT -->
    <div class="section">
      <h2><i class="fas fa-clipboard-check"></i> Assessment Details</h2>
      <div class="grid">
        <div class="field"><span class="label">Assessment Score</span><span class="value">${muted(t.assessmentScore)}</span></div>
        <div class="field"><span class="label">Assessment Date</span><span class="value">${muted(t.assessmentDate)}</span></div>
        <div class="field"><span class="label">Result</span><span class="value">${muted(t.assessmentResult)}</span></div>
      </div>
    </div>

    <!-- EMPLOYMENT -->
    <div class="section">
      <h2><i class="fas fa-briefcase"></i> Employment Status</h2>
      <div class="grid">
        <div class="field"><span class="label">Current Status</span><span class="value">${muted(t.empStatus)}</span></div>
        <div class="field"><span class="label">Employer</span><span class="value">${muted(t.empCompany)}</span></div>
        <div class="field"><span class="label">Job Role</span><span class="value">${muted(t.empRole)}</span></div>
        <div class="field"><span class="label">Employment Type</span><span class="value">${muted(t.empType)}</span></div>
        <div class="field"><span class="label">Joining Date</span><span class="value">${muted(t.empJoining)}</span></div>
        <div class="field"><span class="label">Job Location</span><span class="value">${muted(t.empLocation)}</span></div>
      </div>
    </div>

    <!-- INCOME & FOLLOW-UP -->
    <div class="section">
      <h2><i class="fas fa-rupee-sign"></i> Income & Retention</h2>
      <div class="grid">
        <div class="field">
          <span class="label">Current Monthly Income</span>
          <span class="value">${t.empIncome ? '₹' + Number(t.empIncome).toLocaleString() : '<span class="value muted">Not updated</span>'}</span>
        </div>
        <div class="field">
          <span class="label">Previous Monthly Income</span>
          <span class="value">${t.empPrevIncome ? '₹' + Number(t.empPrevIncome).toLocaleString() : '<span class="value muted">Not recorded</span>'}</span>
        </div>
        <div class="field"><span class="label">Follow-up Period</span><span class="value">${muted(t.followupPeriod)}</span></div>
        <div class="field"><span class="label">Follow-up Status</span><span class="value">${muted(t.followupStatus)}</span></div>
        <div class="field"><span class="label">Follow-up Date</span><span class="value">${muted(t.followupDate)}</span></div>
      </div>
    </div>

    <!-- REGISTRATION -->
    <div class="section">
      <h2><i class="fas fa-file-alt"></i> Registration Information</h2>
      <div class="grid">
        <div class="field"><span class="label">Registered On</span><span class="value">${muted(t.regDate)}</span></div>
        <div class="field"><span class="label">Registered By</span><span class="value">${muted(t.regBy)}</span></div>
      </div>

      <div class="action-bar">
        <button class="btn btn-outline" onclick="toggleRegDetails()">
          <i class="fas fa-file-alt"></i> View Registration Details
        </button>
      </div>

      <div id="regDetails">
        <strong>Authorized Registration Data (Read-Only)</strong><br>
        Complete authorized lifecycle. Government view has full read access.
        <table>
          <tr><td>Registration Date</td><td>${escapeHtml(t.regDate) || '—'}</td></tr>
          <tr><td>Registered By</td><td>${escapeHtml(t.regBy) || '—'}</td></tr>
          <tr><td>Email</td><td>${escapeHtml(t.email) || '—'}</td></tr>
          <tr><td>Mobile</td><td>${escapeHtml(t.phone) || '—'}</td></tr>
          <tr><td>Course</td><td>${escapeHtml(t.course) || '—'}</td></tr>
          <tr><td>Training Provider</td><td>${escapeHtml(t.provider) || '—'}</td></tr>
          <tr><td>Batch</td><td>${escapeHtml(t.batch) || '—'}</td></tr>
        </table>
      </div>
    </div>

    <!-- VERIFICATION -->
    <div class="section">
      <h2><i class="fas fa-shield-alt"></i> Verification Status</h2>
      <div class="grid">
        <div class="field">
          <span class="label">Current Status</span>
          <span class="value">${escapeHtml(t.verificationStatus.charAt(0).toUpperCase() + t.verificationStatus.slice(1))}</span>
        </div>
        <div class="field"><span class="label">Verified By</span><span class="value">${muted(t.verifiedBy)}</span></div>
        <div class="field"><span class="label">Verified At</span><span class="value">${muted(t.verifiedAt)}</span></div>
      </div>

      <div class="action-bar">
        <a href="dashboard.html" class="btn btn-primary">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>
    </div>
  `;
}

/* ============================================================
   6. ACTIONS
   ============================================================ */
function toggleRegDetails() {
  document.getElementById('regDetails').classList.toggle('show');
}

/* ============================================================
   7. HELPERS
   ============================================================ */
function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function notFoundHTML(message, id) {
  return `
    <div class="notfound-box">
      <i class="fas fa-user-slash"></i>
      <h2>Trainee Not Found</h2>
      <p>${escapeHtml(message)}</p>
      <p>The trainee record you are looking for may not have been registered yet, or the ID is incorrect.</p>
      ${id ? `<div class="id">ID: ${escapeHtml(id)}</div>` : ''}
      <div style="margin-top:24px;">
        <a href="dashboard.html" class="btn btn-primary">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
      </div>
    </div>
  `;
}

/* ============================================================
   8. INIT
   ============================================================ */
render();
</script>

<script src="../js/script.js"></script>
</body>
</html>
